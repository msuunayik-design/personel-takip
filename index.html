const tbl=(h,r,cl)=>`<div class=w><table><tr>${h.map(x=>`<th>${e(x)}</th>`).join('')}</tr>${r.map(x=>`<tr ${cl?`class=r onclick="${cl}(${x.i})"`:''}>${x.map(c=>`<td>${e(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const M=h=>{$('#m').innerHTML='<div>'+h+'</div>';$('#m').style.display='flex'},X=()=>$('#m').style.display='none';
$('#m').onclick=ev=>{if(ev.target.id=='m')X()};
const R={};
function go(t){tab=t;document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==t));agg();R[t]()}
$('#nv').innerHTML=[['pn','Panel'],['pr','Personel'],['iz','İzin / Rapor'],['ys','Yıllık Özet'],['kt','Kartlar']].map(([k,n])=>`<button class=tb data-t=${k} onclick="go('${k}')">${n}</button>`).join('')+'<button onclick=bk()>Yedekle</button><button onclick="$(\'#rf\').click()">Geri Yükle</button><button onclick=csv()>Excel (CSV)</button>';

R.pn=()=>{const P=DB.P,av=f=>{const a=P.map(f).filter(x=>x!=='');return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-'},ty=t=>DB.L.reduce((s,l)=>s+(l.tur==t&&yr(l)==Y?days(l):0),0);
const dist=f=>{const m={};P.forEach(p=>{const k=f(p)||'(boş)';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const kp=[['Toplam Personel',P.length],['Aktif Personel',P.filter(p=>p.durum=='Aktif').length],['Ortalama Yaş',av(p=>yrs(p.dogum))],['Ortalama Kıdem (Yıl)',av(p=>yrs(p.giris))],['Bu Yıl Rapor (Gün)',ty('Rapor')],['Bu Yıl Yıllık İzin (Gün)',ty('Yıllık İzin')]];
$('#v').innerHTML=`<div class=g>${kp.map(([a,b])=>`<div class=k><b>${b}</b><span>${a}</span></div>`).join('')}</div><h4>Birim / Görev Yeri Dağılımı</h4>${tbl(['Birim','Personel'],dist(p=>p.sef))}<h4>Statü Dağılımı</h4>${tbl(['Statü','Personel'],dist(p=>p.statu))}<h4>Bu Yıl (${Y}) İzin/Rapor Türü Dağılımı (Gün)</h4>${tbl(['Tür','Toplam Gün'],TUR.map(t=>[t,ty(t)]).filter(r=>r[1]))}`};

R.pr=()=>{$('#v').innerHTML=`<div class=bar><button class=p onclick="eP(-1)">+ Yeni Personel</button><input placeholder="Ara (ad, sicil, statü...)" value="${e(Q)}" oninput="Q=this.value;tbP()"></div><div id=tb></div>`;tbP()};
function tbP(){const q=N(Q),r=[];DB.P.forEach((p,i)=>{if(q&&!N([full(p),p.sicil,p.statu,p.kadro,p.fiili,p.tel].join(' ')).includes(q))return;r.push(Object.assign([i+1,p.sicil,full(p),p.statu,p.kadro,p.fiili,yrs(p.dogum),yrs(p.giris),p.durum,sm(p,'Rapor',Y),sm(p,'Yıllık İzin',Y),sm(p,'Rapor'),sm(p,'Yıllık İzin')],{i}))});
$('#tb').innerHTML=tbl(['Sıra','Sicil','Ad Soyad','Statü','Kadro Unvanı','Fiili Görev','Yaş','Kıdem','Durum','Bu Yıl Rapor','Bu Yıl İzin','Toplam Rapor','Toplam İzin'],r,'eP')}
function eP(i){const d=DB.P[0]||{},p=i<0?{durum:'Aktif',daire:d.daire,birim:d.birim,sef:d.sef,ilce:d.ilce}:DB.P[i];let h=`<h3>${i<0?'Yeni Personel':'Personel Bilgileri'}</h3><div class=f>`;
for(const[k,lb,ty,o]of PF)h+=ty=='s'?`<label>${lb}<select id=f_${k}>${['',...o].map(v=>`<option ${v==p[k]?'selected':''}>${e(v)}</option>`).join('')}</select></label>`:`<label>${lb}<input id=f_${k} ${ty=='date'?'type=date':''} ${ty=='l'?`list=dl_${k}`:''} value="${e(p[k])}" oninput=au()></label>`;
h+='</div>';for(const[k,,ty]of PF)if(ty=='l')h+=`<datalist id=dl_${k}>${[...new Set(DB.P.map(x=>x[k]).filter(Boolean))].map(v=>`<option value="${e(v)}">`).join('')}</datalist>`;
h+=`<p id=aui class=mu></p><div class=bar><button class=p onclick="sP(${i})">Kaydet</button><button onclick=X()>Vazgeç</button>${i>=0?`<button class=d onclick="dP(${i})">Sil</button>`:''}</div>`;M(h);au()}
function au(){const g=k=>$('#f_'+k).value;$('#aui').textContent=`Otomatik → Tam Ad: ${(g('ad').trim()+' '+g('soyad').trim()).trim()} · Yaş: ${yrs(g('dogum'))} · Kıdem: ${yrs(g('giris'))} yıl`}
function sP(i){const o={};PF.forEach(([k])=>o[k]=$('#f_'+k).value.trim());if(!o.ad||!o.soyad)return alert('Ad ve Soyad zorunludur.');
const old=i>=0?N(full(DB.P[i])):'',nk=N(full(o));if(DB.P.some((x,j)=>j!=i&&N(full(x))==nk)&&!confirm('Aynı ad-soyadda başka bir personel var; izin/rapor eşleştirmesi karışabilir. Yine de kaydedilsin mi?'))return;
if(i>=0){if(old!=nk)DB.L.forEach(l=>{if(N(l.ad)==old)l.ad=full(o)});o.foto=DB.P[i].foto;DB.P[i]=o}else DB.P.push(o);save();X();go(tab)}
function dP(i){if(confirm(full(DB.P[i])+' silinsin mi? (İzin/rapor kayıtları korunur)')){DB.P.splice(i,1);save();X();go(tab)}}

R.iz=()=>{const ys=[...new Set(DB.L.map(yr).filter(Boolean))].sort((a,b)=>b-a),op=(a,v)=>a.map(t=>`<option ${t==v?'selected':''}>${t}</option>`).join('');
$('#v').innerHTML=`<div class=bar><button class=p onclick="eL(-1)">+ Yeni Kayıt</button><input placeholder="Ad ara" value="${e(FN)}" oninput="FN=this.value;tbL()"><select onchange="FY=this.value;tbL()"><option value="">Tüm yıllar</option>${op(ys,FY)}</select><select onchange="FT=this.value;tbL()"><option value="">Tüm türler</option>${op(TUR,FT)}</select></div><div id=tb></div>`;tbL()};
function tbL(){const q=N(FN),r=[];DB.L.forEach((l,i)=>{if((q&&!N(l.ad).includes(q))||(FY&&yr(l)!=FY)||(FT&&l.tur!=FT))return;r.push(Object.assign([fd(l.bas),fd(l.bit),l.ad,l.tur,days(l)||'',yr(l)||'',fd(nxt(l.bit)),NS.has(N(l.ad))?'✓':'⚠ eşleşmedi',l.not],{i}))});
r.sort((a,b)=>DB.L[b.i].bas.localeCompare(DB.L[a.i].bas));const n=r.length;
$('#tb').innerHTML=`<div class=mu>${n} kayıt${n>300?' (ilk 300 gösteriliyor)':''}</div>`+tbl(['Başlama','Bitiş','Ad Soyad','Tür','Süre (Gün)','Yıl','Göreve Dönüş','Eşleşme','Not'],r.slice(0,300),'eL')}
function eL(i){const l=i<0?{tur:'Rapor'}:DB.L[i],nm=DB.P.map(full);if(l.ad&&!NS.has(N(l.ad)))nm.push(l.ad);
M(`<h3>${i<0?'Yeni İzin / Rapor Kaydı':'İzin / Rapor Kaydı'}</h3><div class=f><label>Personel<select id=l_ad><option value="">Seçiniz</option>${nm.map(n=>`<option ${N(n)==N(l.ad)?'selected':''}>${e(n)}</option>`).join('')}</select></label><label>Tür<select id=l_tur>${TUR.map(t=>`<option ${t==l.tur?'selected':''}>${t}</option>`).join('')}</select></label><label>Başlama Tarihi<input id=l_bas type=date value="${l.bas||''}" oninput=al()></label><label>Bitiş Tarihi<input id=l_bit type=date value="${l.bit||''}" oninput=al()></label><label>Not<input id=l_not value="${e(l.not)}"></label></div><p id=ali class=mu></p><div class=bar><button class=p onclick="sL(${i})">Kaydet</button><button onclick=X()>Vazgeç</button>${i>=0?`<button class=d onclick="dL(${i})">Sil</button>`:''}</div>`);al()}
function al(){const o={bas:$('#l_bas').value,bit:$('#l_bit').value};$('#ali').textContent=`Otomatik → Süre: ${days(o)} gün · Yıl: ${yr(o)||''} · Göreve dönüş: ${fd(nxt(o.bit))}`}
function sL(i){const o={ad:$('#l_ad').value,tur:$('#l_tur').value,bas:$('#l_bas').value,bit:$('#l_bit').value,not:$('#l_not').value.trim()};if(!o.ad||!o.bas||!o.bit)return alert('Personel, başlama ve bitiş tarihi zorunludur.');if(o.bit<o.bas)return alert('Bitiş tarihi başlamadan önce olamaz.');
const p=DB.P.find(x=>N(full(x))==N(o.ad));o.unvan=p?p.statu:(i>=0?DB.L[i].unvan:'');if(i>=0)Object.assign(DB.L[i],o);else DB.L.push({...o,ham:o.tur});save();X();go(tab)}
function dL(i){if(confirm('Bu kayıt silinsin mi?')){DB.L.splice(i,1);save();X();go(tab)}}

R.ys=()=>{const a=DB.L.map(yr).filter(Boolean),y0=Math.min(2015,...a),y1=Math.max(Y,...a),ys=[];for(let y=y0;y<=y1;y++)ys.push(y);
const r=DB.P.map(p=>[full(p),...ys.map(y=>sm(p,FS,y)||''),sm(p,FS)]);r.push(['TOPLAM',...ys.map(y=>DB.P.reduce((s,p)=>s+sm(p,FS,y),0)||''),DB.P.reduce((s,p)=>s+sm(p,FS),0)]);
$('#v').innerHTML=`<div class=bar><b>Personel bazında yıllara göre (gün):</b><select onchange="FS=this.value;R.ys()">${TUR.map(t=>`<option ${t==FS?'selected':''}>${t}</option>`).join('')}</select></div>`+tbl(['Tam Ad',...ys,'TOPLAM'],r)};

R.kt=()=>{$('#v').innerHTML=`<div class=g style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${DB.P.map((p,i)=>`<div class=cd>${p.foto?`<img src="${p.foto}" onclick="ph(${i})">`:`<div class=ph onclick="ph(${i})">📷</div>`}<b>${e(full(p))}</b><div>Sicil No: ${e(p.sicil)}</div><div>${e(p.kadro)}</div><div>${e(p.birim)}</div><div>${e(p.tel)}</div></div>`).join('')}</div><input type=file id=pf accept="image/*" hidden>`};
function ph(i){const f=$('#pf');f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=168;c.height=208;const s=Math.max(168/im.width,208/im.height);c.getContext('2d').drawImage(im,(168-im.width*s)/2,(208-im.height*s)/2,im.width*s,im.height*s);DB.P[i].foto=c.toDataURL('image/jpeg',.8);save();R.kt()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}

function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
const bk=()=>dl('haller-personel-yedek-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB),'application/json');
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.P||!d.L)throw 0;if(confirm('Mevcut veriler yedekteki verilerle değiştirilecek. Devam edilsin mi?')){DB=d;save();go(tab)}}catch(x){alert('Geçersiz yedek dosyası.')}};r.readAsText(f);$('#rf').value=''}
function csv(){agg();const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',row=a=>a.map(q).join(';'),B='\ufeff';
dl('Personel_Listesi.csv',B+[row(['Sıra No',...PF.map(f=>f[1]),'Tam Ad','Yaş','Kıdem (Yıl)','Bu Yıl Rapor (Gün)','Bu Yıl Yıllık İzin (Gün)','Toplam Rapor (Gün)','Toplam Yıllık İzin (Gün)']),...DB.P.map((p,i)=>row([i+1,...PF.map(f=>p[f[0]]),full(p),yrs(p.dogum),yrs(p.giris),sm(p,'Rapor',Y),sm(p,'Yıllık İzin',Y),sm(p,'Rapor'),sm(p,'Yıllık İzin')]))].join('\r\n'),'text/csv;charset=utf-8');
setTimeout(()=>dl('Izin_Rapor_Kayitlari.csv',B+[row(['Sıra No','Ad Soyad','Unvanı','Tür','Başlama Tarihi','Bitiş Tarihi','Süre (Gün)','Yıl','Göreve Dönüş Tarihi','Eşleşen Personel','Not']),...DB.L.map((l,i)=>row([i+1,l.ad,l.unvan,l.tur,fd(l.bas),fd(l.bit),days(l),yr(l),fd(nxt(l.bit)),NS.has(N(l.ad))?l.ad:'',l.not]))].join('\r\n'),'text/csv;charset=utf-8'),600)}
save();go('pn');
</script></body></html>
